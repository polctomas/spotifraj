<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14101f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Moja Hudba</title>
<style>
:root{--bg:#14101f;--s1:#1f1a30;--s2:#2b2542;--tx:#f4f1ff;--mu:#9d95b8;--ac:#ff7a90;--ac2:#7c6cff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:18px 20px 8px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:28px;letter-spacing:-.5px}
main{flex:1;overflow-y:auto;padding:0 14px 150px}
.tab{display:none}.tab.on{display:block}
.btn{background:var(--ac);color:#2a0d14;font-weight:700;padding:11px 18px;border-radius:99px}
.btn.alt{background:var(--s2);color:var(--tx)}
.row{display:flex;gap:10px;margin:8px 6px 14px}
.song{position:relative;display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;background:var(--bg);touch-action:pan-y;user-select:none}
.song.cur .t{color:var(--ac)}
.art{width:48px;height:48px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff8}
.meta{flex:1;min-width:0}.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{color:var(--mu);font-size:13px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mu);font-size:18px}
.ib:active{background:var(--s2)}
.wrap{position:relative;border-radius:14px;overflow:hidden;margin-bottom:4px;background:#3a1626}
.wrap::before{content:"Odstrániť ✕";position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--ac);font-weight:700;font-size:14px}
.handle{touch-action:none;cursor:grab;font-size:22px}
.wrap.drag{outline:2px solid var(--ac2);z-index:3}
.empty{text-align:center;color:var(--mu);padding:60px 20px;line-height:1.6}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
h3{margin:16px 8px 6px;font-size:15px;color:var(--mu);font-weight:600}
/* timer */
.timer{text-align:center;padding:30px 10px}
.big{font-size:76px;font-weight:300;letter-spacing:-3px;font-variant-numeric:tabular-nums;margin:10px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:9px;background:linear-gradient(90deg,var(--ac) var(--p,0%),var(--s2) var(--p,0%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 10px #0008}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:#fff}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.chip{background:var(--s1);padding:8px 14px;border-radius:99px;color:var(--mu)}
/* mini + nav */
#mini{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));background:var(--s2);border-radius:18px;padding:8px 10px;display:none;align-items:center;gap:10px;box-shadow:0 8px 30px #0009;z-index:5}
#mini .bar{position:absolute;left:14px;right:14px;bottom:0;height:3px;background:#fff2;border-radius:3px}
#mini .bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:3px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e0a18f0;backdrop-filter:blur(14px);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mu);padding:6px}
nav button span{font-size:22px}nav button.on{color:var(--ac)}
/* player */
#player{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 26px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);background:linear-gradient(180deg,var(--g1,#3b2a6b),var(--bg) 70%)}
#player.open{transform:none}
.cover{flex:1;max-height:42vh;aspect-ratio:1;margin:18px auto;border-radius:28px;display:grid;place-items:center;font-size:90px;font-weight:800;color:#fff7;box-shadow:0 24px 60px #0008;transition:transform .4s}
.playing .cover{transform:scale(1)}.paused .cover{transform:scale(.88)}
#pt{font-size:24px;font-weight:700;margin-top:6px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.ctl .ib{width:52px;height:52px;font-size:26px;color:var(--tx)}
.ctl .on{color:var(--ac)}
.play{width:74px!important;height:74px!important;background:#fff;color:#14101f!important;font-size:30px!important}
.tm{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:#fff;color:#14101f;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.25s;z-index:50;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">
<header><h1 id="title">Knižnica</h1><button class="btn" id="add">+ Pridať skladby</button></header>
<input type="file" id="file" accept="audio/*" multiple hidden>
<main>
  <section class="tab on" id="t-lib"></section>
  <section class="tab" id="t-q"></section>
  <section class="tab" id="t-sl">
    <div class="timer">
      <div class="s">Hudba sa po uplynutí času pomaly stíchne a zastaví</div>
      <div class="big" id="tbig">30:00</div>
      <input type="range" id="tr" min="1" max="180" value="30">
      <div class="chips"><button class="chip" data-m="5">5 min</button><button class="chip" data-m="15">15 min</button><button class="chip" data-m="30">30 min</button><button class="chip" data-m="60">1 hod</button></div>
      <button class="btn" id="tgo" style="padding:15px 40px;font-size:17px">Spustiť časovač</button>
    </div>
  </section>
</main>

<div id="mini"><div class="art" id="ma"></div><div class="meta" id="mopen"><div class="t" id="mt"></div><div class="s">Ťukni pre prehrávač</div></div><button class="ib" id="mp">▶</button><button class="ib" id="mn">⏭</button><div class="bar"><i id="mb"></i></div></div>
<nav><button data-t="lib" class="on"><span>♪</span>Knižnica</button><button data-t="q"><span>☰</span>Ďalej</button><button data-t="sl"><span>☾</span>Časovač</button></nav>

<div id="player" class="paused">
  <button class="ib" id="pclose" style="font-size:26px">⌄</button>
  <div class="cover" id="pc"></div>
  <div id="pt">—</div><div class="s" id="ps">Moja hudba</div>
  <div style="margin-top:20px"><input type="range" id="seek" min="0" max="1000" value="0"><div class="tm"><span id="cu">0:00</span><span id="du">0:00</span></div></div>
  <div class="ctl">
    <button class="ib" id="psh" title="Náhodné poradie">⤮</button>
    <button class="ib" id="pp">⏮</button>
    <button class="ib play" id="pplay">▶</button>
    <button class="ib" id="pn">⏭</button>
    <button class="ib" id="ptm" title="Časovač">☾</button>
  </div>
</div>
<div id="toast"></div>
</div>
<audio id="au" preload="auto"></audio>

<script>
const $=s=>document.querySelector(s),au=$('#au');
let lib=[],queue=[],cur=-1,url=null,sleepEnd=0,sleepTick=null;
/* ---------- uložisko (IndexedDB) ---------- */
const db=new Promise(r=>{const q=indexedDB.open('hudba',1);q.onupgradeneeded=()=>q.result.createObjectStore('s',{keyPath:'id'});q.onsuccess=()=>r(q.result)});
const tx=(m,f)=>db.then(d=>new Promise(r=>{const t=d.transaction('s',m),rq=f(t.objectStore('s'));t.oncomplete=()=>r(rq.result)}));
/* ---------- pomocné ---------- */
const song=id=>lib.find(s=>s.id===id);
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const grad=n=>{const h=hue(n);return`linear-gradient(135deg,hsl(${h} 70% 55%),hsl(${(h+60)%360} 70% 40%))`};
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
const art=s=>`<div class="art" style="background:${grad(s.name)}">${s.name[0].toUpperCase()}</div>`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
/* ---------- načítanie skladieb ---------- */
$('#add').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  for(const f of e.target.files){
    const s={id:Date.now()+Math.random().toString(36).slice(2),name:f.name.replace(/\.[^.]+$/,''),blob:f};
    await tx('readwrite',st=>st.put(s));lib.push(s);
  }
  toast(e.target.files.length+' skladieb pridaných');e.target.value='';render();
};
/* ---------- prehrávanie ---------- */
function load(i,play=true){
  if(i<0||i>=queue.length)return;
  cur=i;const s=song(queue[i]);if(!s)return;
  if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(s.blob);au.src=url;au.volume=1;
  if(play)au.play().catch(()=>{});
  $('#mini').style.display='flex';
  $('#mt').textContent=$('#pt').textContent=s.name;
  $('#ma').outerHTML=`<div class="art" id="ma" style="background:${grad(s.name)}">${s.name[0].toUpperCase()}</div>`;
  const c=$('#pc');c.style.background=grad(s.name);c.textContent=s.name[0].toUpperCase();
  $('#player').style.setProperty('--g1',`hsl(${hue(s.name)} 45% 28%)`);
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:'Moja Hudba'});
  render();
}
const next=()=>cur+1<queue.length?load(cur+1):(au.pause(),au.currentTime=0);
const prev=()=>au.currentTime>3?au.currentTime=0:load(Math.max(0,cur-1));
const toggle=()=>au.paused?au.play():au.pause();
au.onended=next;
au.onplay=au.onpause=()=>{const p=!au.paused;$('#mp').textContent=$('#pplay').textContent=p?'⏸':'▶';$('#player').className=(p?'playing':'paused')+($('#player').classList.contains('open')?' open':'')};
au.ontimeupdate=()=>{const d=au.duration||0;$('#mb').style.width=d?au.currentTime/d*100+'%':0;if(!seeking){$('#seek').value=d?au.currentTime/d*1000:0;setP($('#seek'))}$('#cu').textContent=fmt(au.currentTime);$('#du').textContent=fmt(d)};
let seeking=false;const sk=$('#seek');
sk.oninput=()=>{seeking=true;setP(sk);au.currentTime=sk.value/1000*(au.duration||0)};sk.onchange=()=>seeking=false;
function setP(r){r.style.setProperty('--p',(r.value-r.min)/(r.max-r.min)*100+'%')}
$('#mp').onclick=$('#pplay').onclick=toggle;$('#mn').onclick=$('#pn').onclick=next;$('#pp').onclick=prev;
if('mediaSession' in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());m.setActionHandler('nexttrack',next);m.setActionHandler('previoustrack',prev)}
/* ---------- rad + náhodné poradie ---------- */
function playFrom(id){queue=lib.map(s=>s.id);load(queue.indexOf(id))}
function shuffle(){
  if(!queue.length){queue=lib.map(s=>s.id);if(!queue.length)return toast('Najprv pridaj skladby');}
  const head=cur>=0?queue.slice(0,cur+1):[],tail=queue.slice(cur+1),old=tail.join();
  if(cur<0&&!head.length){shuffleArr(tail);queue=tail;load(0);toast('Náhodné poradie');return}
  let n=0;do{shuffleArr(tail)}while(tail.length>1&&tail.join()===old&&++n<20);
  queue=head.concat(tail);toast('Poradie premiešané');render();
}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}}
$('#psh').onclick=shuffle;
/* ---------- vykresľovanie ---------- */
function render(){
  const L=$('#t-lib');
  L.innerHTML=lib.length?`<div class="row"><button class="btn" id="sh1">⤮ Náhodne prehrať všetko</button></div>`+lib.map(s=>`<div class="song ${queue[cur]===s.id?'cur':''}" data-id="${s.id}">${art(s)}<div class="meta"><div class="t">${esc(s.name)}</div><div class="s">Z tvojho telefónu</div></div><button class="ib" data-a="q" title="Pridať do Ďalej">＋</button><button class="ib" data-a="d" title="Zmazať">🗑</button></div>`).join('')
  :`<div class="empty"><b>Zatiaľ tu nie je žiadna hudba</b>Ťukni na „Pridať skladby“ a vyber piesne stiahnuté v telefóne.</div>`;
  const sh=$('#sh1');if(sh)sh.onclick=()=>{queue=[];cur=-1;shuffle()};
  L.querySelectorAll('.song').forEach(el=>el.onclick=e=>{const a=e.target.dataset.a,id=el.dataset.id;
    if(a==='q'){queue.push(id);toast('Pridané do Ďalej');render()}
    else if(a==='d'){delSong(id)}else playFrom(id)});
  renderQ();
}
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function delSong(id){
  if(!confirm('Zmazať skladbu z appky?'))return;
  await tx('readwrite',st=>st.delete(id));lib=lib.filter(s=>s.id!==id);
  const playing=queue[cur];queue=queue.filter(x=>x!==id);cur=queue.indexOf(playing);
  if(cur<0&&playing===id){au.pause();au.removeAttribute('src');$('#mini').style.display='none';}
  render();
}
function renderQ(){
  const Q=$('#t-q'),now=song(queue[cur]),up=queue.slice(cur+1);
  if(!now&&!queue.length){Q.innerHTML=`<div class="empty"><b>Rad je prázdny</b>Spusti skladbu v knižnici alebo ťukni na ＋ pri skladbe.</div>`;return}
  Q.innerHTML=(now?`<h3>Teraz hrá</h3><div class="song cur">${art(now)}<div class="meta"><div class="t">${esc(now.name)}</div></div></div>`:'')+
  `<div class="row" style="align-items:center;justify-content:space-between;margin-bottom:0"><h3 style="margin:8px 0">Ďalej (${up.length})</h3><button class="btn alt" id="sh2">⤮ Náhodne</button></div>`+
  `<div class="s" style="margin:0 8px 10px">Potiahni doprava = odstrániť · potiahni ≡ = zmeniť poradie</div><div id="ql">`+
  up.map(id=>{const s=song(id);return`<div class="wrap" data-id="${id}"><div class="song">${art(s)}<div class="meta"><div class="t">${esc(s.name)}</div></div><div class="ib handle">≡</div></div></div>`}).join('')+`</div>`;
  $('#sh2').onclick=shuffle;
  Q.querySelectorAll('.wrap').forEach(setupRow);
}
function setupRow(w){
  const sg=w.firstElementChild,h=w.querySelector('.handle');let x0=0,dx=0,sw=false;
  sg.onpointerdown=e=>{if(e.target===h)return;x0=e.clientX;dx=0;sw=true;sg.setPointerCapture(e.pointerId);sg.style.transition='none'};
  sg.onpointermove=e=>{if(!sw)return;dx=Math.max(0,e.clientX-x0);sg.style.transform=`translateX(${dx}px)`};
  const end=()=>{if(!sw)return;sw=false;sg.style.transition='transform .22s';
    if(dx>110){sg.style.transform='translateX(110%)';setTimeout(()=>{const i=queue.indexOf(w.dataset.id,cur+1);if(i>-1)queue.splice(i,1);toast('Odstránené z radu');renderQ()},200)}
    else sg.style.transform=''};
  sg.onpointerup=sg.onpointercancel=end;
  h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture(e.pointerId);w.classList.add('drag')};
  h.onpointermove=e=>{if(!w.classList.contains('drag'))return;const list=w.parentNode;
    const prevE=w.previousElementSibling,nextE=w.nextElementSibling;
    if(prevE){const r=prevE.getBoundingClientRect();if(e.clientY<r.top+r.height/2)list.insertBefore(w,prevE)}
    if(nextE){const r=nextE.getBoundingClientRect();if(e.clientY>r.top+r.height/2)list.insertBefore(nextE,w)}};
  h.onpointerup=h.onpointercancel=()=>{w.classList.remove('drag');
    const ids=[...w.parentNode.children].map(c=>c.dataset.id);queue=queue.slice(0,cur+1).concat(ids)};
}
/* ---------- časovač spánku ---------- */
const tr=$('#tr');
const showT=m=>{$('#tbig').textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':00';setP(tr)};
const fmtT=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(c).padStart(2,'0')};
tr.oninput=()=>{if(!sleepEnd){const m=+tr.value;$('#tbig').textContent=m>=60?Math.floor(m/60)+' h '+(m%60?m%60+' min':''):m+' min';setP(tr)}};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{tr.value=c.dataset.m;tr.oninput()});
$('#tgo').onclick=()=>{
  if(sleepEnd){clearInterval(sleepTick);sleepEnd=0;au.volume=1;$('#tgo').textContent='Spustiť časovač';tr.disabled=false;tr.oninput();toast('Časovač zrušený');return}
  sleepEnd=Date.now()+tr.value*60000;tr.disabled=true;$('#tgo').textContent='Zrušiť časovač';
  const tick=()=>{const left=Math.round((sleepEnd-Date.now())/1000);
    if(left<=0){clearInterval(sleepTick);sleepEnd=0;au.pause();au.volume=1;$('#tgo').textContent='Spustiť časovač';tr.disabled=false;tr.oninput();toast('Časovač vypol hudbu 🌙');return}
    $('#tbig').textContent=fmtT(left);if(left<=10)au.volume=Math.max(0,left/10)};
  tick();sleepTick=setInterval(tick,500);toast('Hudba sa vypne o '+tr.value+' min');
};
/* ---------- navigácia ---------- */
const names={lib:'Knižnica',q:'Ďalej',sl:'Časovač spánku'};
function go(t){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-'+t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('#title').textContent=names[t];$('#add').style.display=t==='lib'?'':'none';$('#player').classList.remove('open')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
$('#mopen').onclick=$('#ma').onclick=()=>$('#player').classList.add('open');
$('#pclose').onclick=()=>$('#player').classList.remove('open');
$('#ptm').onclick=()=>go('sl');
/* ---------- štart ---------- */
tx('readonly',s=>s.getAll()).then(r=>{lib=(r||[]).sort((a,b)=>a.name.localeCompare(b.name));render()});
setP(tr);tr.oninput();setP(sk);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
