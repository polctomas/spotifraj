<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Moja Hudba</title>
<style>
@property --h{syntax:'<number>';inherits:true;initial-value:255}
:root{--bg:#07080f;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.11);--line:rgba(255,255,255,.1);--tx:#eef1fb;--mu:#8d96b3;--a1:#7b6cff;--a2:#27d3f5;--grad:linear-gradient(135deg,var(--a1),var(--a2));color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Segoe UI Variable",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
#home{height:100%;overflow-y:auto;padding:calc(26px + env(safe-area-inset-top)) 18px 130px}
h1{font-size:36px;font-weight:800;letter-spacing:-1.2px}
.sub{color:var(--mu);font-size:14px;margin-top:2px}
.search{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:0 14px;margin:20px 0 14px;color:var(--mu)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;padding:14px 0;user-select:text}
.acts{display:flex;gap:10px;margin-bottom:18px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:16px;font-weight:700;background:var(--grad);color:#07080f}
.cta.g{background:var(--glass2);color:var(--tx)}
.acts .cta{flex:1}
.item{display:flex;align-items:center;gap:13px;padding:8px;border-radius:16px;background:var(--bg)}
.item:active{background:var(--glass)}
.art{flex:none;display:grid;place-items:center;font-weight:800;color:#fff9;border-radius:14px;background-size:cover}
.art.sm{width:52px;height:52px;font-size:21px}
.meta{flex:1;min-width:0}
.t{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.item.cur .t{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--mu);flex:none}
.ib:active{background:var(--glass2)}
.eq{display:flex;gap:3px;align-items:flex-end;height:16px;margin-right:4px}
.eq i{width:3px;background:var(--a2);border-radius:2px;animation:eq 1s ease-in-out infinite;animation-play-state:paused}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
body.on .eq i{animation-play-state:running}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.empty{text-align:center;padding:70px 24px;color:var(--mu);line-height:1.5}
.empty .o{width:96px;height:96px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;background:var(--grad);color:#07080f}
.empty b{display:block;color:var(--tx);font-size:20px;margin-bottom:6px}
/* mini */
#mini{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;padding:8px 10px;border-radius:22px;background:rgba(30,32,52,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);box-shadow:0 12px 40px #000a;z-index:5;overflow:hidden}
#mini .art{width:46px;height:46px;font-size:19px}
#mini .pl{width:46px;height:46px;border-radius:50%;background:#fff;color:#07080f;display:grid;place-items:center}
#mbar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--grad)}
/* player */
#player{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 26px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.85,.25,1),visibility 0s .42s,--h .9s;background:radial-gradient(130% 55% at 50% 0%,hsl(var(--h) 65% 34%),transparent 72%),radial-gradient(90% 40% at 100% 100%,hsl(calc(var(--h) + 60) 70% 22% / .7),transparent 70%),var(--bg)}
#player.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.85,.25,1),--h .9s}
.top{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#fffc;font-weight:600}
.cover{width:min(80vw,44vh);aspect-ratio:1;margin:auto;font-size:96px;display:grid;place-items:center;font-weight:800;color:#fff8;border-radius:30px;background-size:cover;box-shadow:0 30px 70px #000b;transform:scale(.86);transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
body.on .cover{transform:scale(1)}
#pt{font-size:26px;font-weight:800;letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pa{color:#ffffffb0;margin-top:3px;font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;outline:0;background:linear-gradient(90deg,#fff var(--p,0%),#ffffff30 var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0008}
input.big::-webkit-slider-thumb{width:30px;height:30px}
input.big{height:10px;background:linear-gradient(90deg,var(--a1),var(--a2) var(--p,0%),#ffffff1a var(--p,0%))}
.tm{display:flex;justify-content:space-between;color:#ffffff99;font-size:12px;margin-top:8px;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:14px 0 18px}
.ctl .ib{width:54px;height:54px;color:#fff}
.ctl .ib.act{color:var(--a2)}
.ctl .main{width:76px;height:76px;background:#fff;color:#07080f}
.row3{display:flex;gap:10px}
.row3 button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 4px;border-radius:18px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:600;backdrop-filter:blur(10px)}
.row3 button:active{background:var(--glass2)}
.row3 button.act{border-color:var(--a2);color:var(--a2)}
.spin{animation:spin .5s}
@keyframes spin{to{transform:rotate(360deg)}}
/* sheet */
#sb{position:fixed;inset:0;background:#0009;z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
#sb.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:80%;display:flex;flex-direction:column;background:#10111c;border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.85,.25,1)}
#sheet.on{transform:none}
#sheet::before{content:"";width:44px;height:5px;border-radius:5px;background:#ffffff30;margin:0 auto 16px;flex:none}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.5px}
#sbody{overflow-y:auto}
.tbig{font-size:64px;font-weight:300;letter-spacing:-2px;text-align:center;margin:18px 0 22px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.chip{padding:9px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--line);color:var(--mu);font-weight:600;font-size:14px}
.chip:active{background:var(--glass2)}
.full{width:100%;padding:16px}
.wrap{position:relative;border-radius:16px;overflow:hidden;margin-bottom:4px;background:#3a1020}
.wrap::before{content:"Odstrániť";position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#ff7a90;font-weight:700;font-size:14px}
.wrap .item{touch-action:pan-y;background:#10111c;position:relative}
.wrap.drag{outline:2px solid var(--a1);z-index:3}
.handle{touch-action:none}
h3{font-size:13px;color:var(--mu);font-weight:600;margin:14px 4px 6px}
.hint{color:var(--mu);font-size:12.5px;margin:0 4px 10px}
#toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top));transform:translate(-50%,-30px);background:#fff;color:#07080f;padding:11px 20px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.28s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="home">
  <h1>Knižnica</h1><div class="sub" id="count"></div>
  <label class="search"><span data-ic="search" data-s="20"></span><input id="q" placeholder="Hľadať skladbu alebo interpreta" autocomplete="off"></label>
  <div class="acts"><button class="cta" id="shAll"><span data-ic="shuffle" data-s="20"></span>Náhodne</button><button class="cta g" id="add"><span data-ic="plus" data-s="20"></span>Pridať skladby</button></div>
  <div id="list"></div>
</div>
<input type="file" id="file" accept="audio/*" multiple hidden>

<div id="mini"><div id="ma" class="art"></div><div class="meta" id="mopen"><div class="t" id="mt"></div><div class="s" id="ms"></div></div><button class="pl" id="mp"></button><div id="mbar"></div></div>

<div id="player">
  <div class="top"><button class="ib" id="pclose" style="color:#fff" data-ic="down" data-s="30"></button><span>Teraz hrá</span><span style="width:42px"></span></div>
  <div class="cover" id="pcov"></div>
  <div><div id="pt">—</div><div id="pa"></div></div>
  <div style="margin-top:22px"><input type="range" id="seek" min="0" max="1000" value="0"><div class="tm"><span id="cu">0:00</span><span id="du">0:00</span></div></div>
  <div class="ctl"><button class="ib" id="prep"></button><button class="ib" id="pprev" data-ic="prev" data-s="34"></button><button class="ib main" id="pplay"></button><button class="ib" id="pnext" data-ic="next" data-s="34"></button><span style="width:54px"></span></div>
  <div class="row3">
    <button id="bsh"><span data-ic="shuffle" data-s="24"></span>Náhodne</button>
    <button id="btm"><span data-ic="moon" data-s="24"></span><span id="tlab">Časovač</span></button>
    <button id="bq"><span data-ic="queue" data-s="24"></span>Ďalej</button>
  </div>
</div>

<div id="sb"></div><div id="sheet"><div id="sbody"></div></div>
<div id="toast"></div>
<audio id="au" preload="auto"></audio>

<script>
const $=s=>document.querySelector(s),au=$('#au');
const P={play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zm8 0h4v14h-4z',prev:'M6 6h2v12H6zm3.5 6 8.5 6V6z',next:'M16 6h2v12h-2zM6 18l8.5-6L6 6z',shuffle:'M10.6 9.2 5.4 4 4 5.4l5.2 5.2zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4zm.3 9.4-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2z',repeat:'M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z',moon:'M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z',queue:'M3 13h2v-2H3zm0 4h2v-2H3zm0-8h2V7H3zm4 4h14v-2H7zm0 4h14v-2H7zM7 7v2h14V7z',down:'M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z',plus:'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z',trash:'M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z',drag:'M3 15h18v-2H3zm0-4h18V9H3z',search:'M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z',note:'M12 3v10.6A4 4 0 1 0 14 17V7h4V3z'};
const ic=(n,s=24)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="currentColor"><path d="${P[n]}"/></svg>`;
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,e.dataset.s||24));
let loadId=0,lib=[],queue=[],cur=-1,rep=0,aurl=null,filter='',sleepEnd=0,sleepT=null,tval=30,sheet=null,playerOpen=false;
const covs=new Map();
/* ---------- uložisko ---------- */
const db=new Promise(r=>{const q=indexedDB.open('hudba2',1);q.onupgradeneeded=()=>q.result.createObjectStore('s',{keyPath:'id'});q.onsuccess=()=>r(q.result)});
const tx=(m,f)=>db.then(d=>new Promise(r=>{const t=d.transaction('s',m),rq=f(t.objectStore('s'));t.oncomplete=()=>r(rq.result)}));
/* ---------- pomocné ---------- */
const song=id=>lib.find(s=>s.id===id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hue=s=>{let h=0;for(const c of s.title+s.artist)h=(h*31+c.charCodeAt(0))%360;return h};
const bg=s=>{if(s.coverUrl)return`url(${s.coverUrl}) center/cover`;if(s.cover){if(!covs.has(s.id))covs.set(s.id,URL.createObjectURL(s.cover));return`url(${covs.get(s.id)}) center/cover`}const h=hue(s);return`linear-gradient(135deg,hsl(${h} 70% 55%),hsl(${(h+55)%360} 75% 38%))`};
const ini=s=>(s.cover||s.coverUrl)?'':esc((s.title[0]||'♪').toUpperCase());
const artH=(s,c='sm')=>`<div class="art ${c}" style="background:${bg(s)}">${ini(s)}</div>`;
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2000)}
const setP=r=>r.style.setProperty('--p',(r.value-r.min)/(r.max-r.min)*100+'%');
/* ---------- ID3 (názov, interpret, obal) ---------- */
async function tags(f){
  const o={};
  try{
    const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
    if(h[0]!==73||h[1]!==68||h[2]!==51||h[3]<3)return o;
    const v=h[3],sz=((h[6]&127)<<21)|((h[7]&127)<<14)|((h[8]&127)<<7)|(h[9]&127);
    const b=new Uint8Array(await f.slice(10,10+Math.min(sz,8e6)).arrayBuffer());
    const dec=(a,e)=>{let enc='windows-1250';if(e===1)enc=(a[0]===254&&a[1]===255)?'utf-16be':'utf-16le';else if(e===2)enc='utf-16be';else if(e===3)enc='utf-8';return new TextDecoder(enc).decode(a).replace(/\0|\uFEFF/g,'').trim()};
    let p=0;
    while(p+10<=b.length){
      const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);
      if(!/^[A-Z0-9]{4}$/.test(id))break;
      const fs=v===4?((b[p+4]&127)<<21)|((b[p+5]&127)<<14)|((b[p+6]&127)<<7)|(b[p+7]&127):((b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7])>>>0;
      const d=b.subarray(p+10,p+10+fs);p+=10+fs;
      if(id==='TIT2')o.title=dec(d.subarray(1),d[0]);
      else if(id==='TPE1')o.artist=dec(d.subarray(1),d[0]);
      else if(id==='APIC'&&!o.cover){
        const e=d[0];let i=1;while(i<d.length&&d[i])i++;
        const mime=String.fromCharCode(...d.subarray(1,i));i+=2;
        if(e===1||e===2){while(i<d.length&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2}else{while(i<d.length&&d[i])i++;i++}
        if(i<d.length)o.cover=new Blob([d.slice(i)],{type:mime.includes('/')?mime:'image/jpeg'});
      }
    }
  }catch(e){}
  return o;
}
/* ---------- pridávanie ---------- */
$('#add').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const fl=[...e.target.files];if(!fl.length)return;toast('Pridávam…');
  for(const f of fl){
    const t=await tags(f);let title=f.name.replace(/\.[^.]+$/,''),artist='';
    if(!t.title&&title.includes(' - ')){const k=title.indexOf(' - ');artist=title.slice(0,k);title=title.slice(k+3)}
    const s={id:Date.now()+Math.random().toString(36).slice(2),title:t.title||title,artist:t.artist||artist,cover:t.cover||null,blob:f};
    await tx('readwrite',st=>st.put(s));lib.push(s);
  }
  sortLib();toast(fl.length+(fl.length===1?' skladba pridaná':' skladieb pridaných'));e.target.value='';renderList();
};
const sortLib=()=>lib.sort((a,b)=>a.title.localeCompare(b.title,'sk'));
/* ---------- knižnica ---------- */
const view=()=>{const f=filter.toLowerCase();return lib.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(f))};
function renderList(){
  $('#count').textContent=lib.length?lib.length+(lib.length===1?' skladba':lib.length<5?' skladby':' skladieb'):'Prázdna';
  const v=view();
  $('#list').innerHTML=!lib.length?`<div class="empty"><div class="o">${ic('note',44)}</div><b>Zatiaľ tu nie je hudba</b>Ťukni na „Pridať skladby“ a vyber piesne stiahnuté v telefóne.</div>`
  :!v.length?`<div class="empty">Nič sa nenašlo</div>`
  :v.map(s=>`<div class="item ${queue[cur]===s.id?'cur':''}" data-id="${s.id}">${artH(s)}<div class="meta"><div class="t">${esc(s.title)}</div><div class="s">${esc(s.artist||'Neznámy interpret')}</div></div>${queue[cur]===s.id?'<div class="eq"><i></i><i></i><i></i></div>':''}<button class="ib" data-a="q">${ic('plus',22)}</button><button class="ib" data-a="d">${ic('trash',20)}</button></div>`).join('');
}
$('#q').oninput=e=>{filter=e.target.value;renderList()};
$('#list').onclick=e=>{
  const it=e.target.closest('.item');if(!it)return;const id=it.dataset.id,a=e.target.closest('[data-a]')?.dataset.a;
  if(a==='q'){queue.push(id);toast('Pridané do Ďalej')}
  else if(a==='d')delSong(id);
  else{queue=view().map(s=>s.id);load(queue.indexOf(id));openPlayer()}
};
async function delSong(id){
  if(!confirm('Zmazať skladbu z appky?'))return;
  if(id.startsWith('b_')){const r=JSON.parse(localStorage.rm||'[]');r.push(id);localStorage.rm=JSON.stringify(r)}else await tx('readwrite',st=>st.delete(id));lib=lib.filter(s=>s.id!==id);
  const pl=queue[cur];queue=queue.filter(x=>x!==id);cur=queue.indexOf(pl);
  if(pl===id){au.pause();au.removeAttribute('src');$('#mini').style.display='none';cur=-1;if(playerOpen)history.back()}
  renderList();
}
/* ---------- prehrávanie ---------- */
function load(i,play=true){
  if(i<0||i>=queue.length)return;cur=i;const s=song(queue[i]);if(!s)return;
  const my=++loadId;au.volume=1;
  (s.blob?Promise.resolve(s.blob):fetch(s.url).then(r=>r.blob())).then(b=>{if(my!==loadId)return;if(aurl)URL.revokeObjectURL(aurl);aurl=URL.createObjectURL(b);au.src=aurl;if(play)au.play().catch(()=>{})}).catch(()=>toast('Skladbu sa nepodarilo načítať'));
  $('#mini').style.display='flex';$('#mt').textContent=$('#pt').textContent=s.title;
  $('#ms').textContent=$('#pa').textContent=s.artist||'Neznámy interpret';
  for(const [e,t] of [[$('#ma'),'sm'],[$('#pcov'),'']]){e.style.background=bg(s);e.textContent=ini(s)}
  $('#player').style.setProperty('--h',hue(s));
  if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,artwork:(s.cover||s.coverUrl)?[{src:s.coverUrl||covs.get(s.id)}]:[]})}
  renderList();if(sheet==='q')drawQueue();
}
const next=()=>{if(cur+1<queue.length)load(cur+1);else if(rep===2)load(0);else{au.pause();au.currentTime=0}};
const prev=()=>au.currentTime>3?au.currentTime=0:load(Math.max(0,cur-1));
const toggle=()=>cur<0?0:au.paused?au.play():au.pause();
au.onended=()=>rep===1?(au.currentTime=0,au.play()):next();
/* ---------- ovládanie z uzamknutej obrazovky (natívny plugin) ---------- */
const MC=(()=>{try{const C=window.Capacitor;if(!C)return null;return(C.Plugins&&C.Plugins.MediaCtl)||(C.registerPlugin?C.registerPlugin('MediaCtl'):null)}catch(e){return null}})();
const artC=new Map();
async function art64(s){
  if(artC.has(s.id))return artC.get(s.id);
  const c=document.createElement('canvas');c.width=c.height=300;const x=c.getContext('2d');let ok=false;
  if(s.cover)bg(s);
  const src=s.coverUrl||(s.cover&&covs.get(s.id));
  if(src){try{const im=new Image();im.src=src;await im.decode();x.drawImage(im,0,0,300,300);ok=true}catch(e){}}
  if(!ok){const h=hue(s),g=x.createLinearGradient(0,0,300,300);g.addColorStop(0,`hsl(${h} 70% 55%)`);g.addColorStop(1,`hsl(${(h+55)%360} 75% 38%)`);x.fillStyle=g;x.fillRect(0,0,300,300);x.fillStyle='rgba(255,255,255,.6)';x.font='bold 150px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText((s.title[0]||'♪').toUpperCase(),150,160)}
  const r=c.toDataURL('image/jpeg',.8).split(',')[1];artC.set(s.id,r);return r;
}
async function syncMC(){
  if(!MC||cur<0)return;const s=song(queue[cur]);if(!s)return;
  let a='';try{a=await art64(s)}catch(e){}
  MC.update({title:s.title,artist:s.artist||'',playing:!au.paused,pos:au.currentTime||0,dur:isFinite(au.duration)?au.duration:0,art:a}).catch(()=>{});
}
if(MC)MC.addListener('action',e=>{const a=e.action;if(a==='play')au.play();else if(a==='pause')au.pause();else if(a==='next')next();else if(a==='prev')prev();else if(a==='seek')au.currentTime=e.pos/1000});
au.onloadedmetadata=syncMC;au.onseeked=syncMC;
const upPlay=()=>{const p=!au.paused;document.body.classList.toggle('on',p);$('#mp').innerHTML=ic(p?'pause':'play',26);$('#pplay').innerHTML=ic(p?'pause':'play',38);syncMC()};
au.onplay=au.onpause=upPlay;upPlay();
let seeking=false;const sk=$('#seek');
au.ontimeupdate=()=>{const d=au.duration||0;$('#mbar').style.width=d?au.currentTime/d*100+'%':0;if(!seeking){sk.value=d?au.currentTime/d*1000:0;setP(sk)}$('#cu').textContent=fmt(au.currentTime);$('#du').textContent=fmt(d)};
sk.oninput=()=>{seeking=true;setP(sk);au.currentTime=sk.value/1000*(au.duration||0)};sk.onchange=()=>seeking=false;
$('#mp').onclick=$('#pplay').onclick=toggle;$('#pnext').onclick=next;$('#pprev').onclick=prev;
const repL=()=>{$('#prep').innerHTML=ic('repeat',26)+(rep===1?'<b style="position:absolute;font-size:11px;margin-top:1px">1</b>':'');$('#prep').classList.toggle('act',rep>0);$('#prep').style.position='relative'};
$('#prep').onclick=()=>{rep=(rep+1)%3;repL();toast(['Opakovanie vypnuté','Opakovať skladbu','Opakovať celý rad'][rep])};repL();
if('mediaSession' in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());m.setActionHandler('nexttrack',next);m.setActionHandler('previoustrack',prev)}
/* ---------- náhodné poradie ---------- */
const shufA=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}};
function shuffle(){
  if(!lib.length)return toast('Najprv pridaj skladby');
  if(cur<0){queue=lib.map(s=>s.id);shufA(queue);load(0);openPlayer();return toast('Náhodné poradie')}
  const head=queue.slice(0,cur+1),tail=queue.slice(cur+1),old=tail.join();
  if(tail.length<2)return toast('V rade nie je dosť skladieb');
  let n=0;do shufA(tail);while(tail.join()===old&&++n<20);
  queue=head.concat(tail);toast('Poradie premiešané');
  const i=$('#bsh').firstElementChild;i.classList.remove('spin');void i.offsetWidth;i.classList.add('spin');
  if(sheet==='q')drawQueue();
}
$('#shAll').onclick=()=>{queue=[];cur=-1;shuffle()};$('#bsh').onclick=shuffle;
/* ---------- okná (player, sheet) a tlačidlo späť ---------- */
function openPlayer(){if(playerOpen||cur<0)return;playerOpen=true;$('#player').classList.add('open');history.pushState({p:1},'')}
$('#mopen').onclick=$('#ma').onclick=openPlayer;
$('#pclose').onclick=()=>{if(playerOpen)history.back()};
function openSheet(k){sheet=k;$('#sb').classList.add('on');$('#sheet').classList.add('on');history.pushState({s:1},'');draw()}
const closeSheet=()=>{if(sheet)history.back()};
const draw=()=>sheet==='t'?drawTimer():sheet==='q'?drawQueue():0;
window.onpopstate=()=>{
  if(sheet){sheet=null;$('#sb').classList.remove('on');$('#sheet').classList.remove('on')}
  else if(playerOpen){playerOpen=false;$('#player').classList.remove('open')}
};
$('#sb').onclick=closeSheet;
$('#btm').onclick=()=>openSheet('t');$('#bq').onclick=()=>openSheet('q');
/* ---------- časovač spánku ---------- */
const lab=m=>m>=60?Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':''):m+' min';
const fT=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(c).padStart(2,'0')};
function drawTimer(){
  const on=!!sleepEnd;
  $('#sbody').innerHTML=`<h2>Časovač spánku</h2><div class="s">${on?'Hudba sa o chvíľu stíši a zastaví':'Vyber presný čas, po ktorom sa hudba vypne'}</div><div class="tbig" id="tbig">${on?fT(Math.max(0,Math.round((sleepEnd-Date.now())/1000))):lab(tval)}</div>`+
  (on?'':`<input type="range" class="big" id="tr" min="1" max="180" value="${tval}"><div class="chips">${[5,15,30,45,60,90].map(m=>`<button class="chip" data-m="${m}">${lab(m)}</button>`).join('')}</div>`)+
  `<button class="cta full" id="tgo" style="${on?'':'margin-top:6px'}">${on?'Zrušiť časovač':'Spustiť časovač'}</button>`;
  const tr=$('#tr');
  if(tr){setP(tr);tr.oninput=()=>{tval=+tr.value;$('#tbig').textContent=lab(tval);setP(tr)};
    document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{tr.value=c.dataset.m;tr.oninput()})}
  $('#tgo').onclick=()=>{
    if(sleepEnd){stopSleep();toast('Časovač zrušený');drawTimer();return}
    sleepEnd=Date.now()+tval*60000;sleepT=setInterval(tick,500);tick();closeSheet();toast('Hudba sa vypne o '+lab(tval));
  };
}
function stopSleep(){clearInterval(sleepT);sleepEnd=0;au.volume=1;$('#tlab').textContent='Časovač';$('#btm').classList.remove('act')}
function tick(){
  const left=Math.round((sleepEnd-Date.now())/1000);
  if(left<=0){au.pause();stopSleep();toast('Časovač vypol hudbu');if(sheet==='t')drawTimer();return}
  $('#tlab').textContent=fT(left);$('#btm').classList.add('act');
  if(sheet==='t'&&$('#tbig'))$('#tbig').textContent=fT(left);
  if(left<=10)au.volume=Math.max(0,left/10);
}
document.addEventListener('visibilitychange',()=>{if(sleepEnd)tick()});
/* ---------- rad „Ďalej“ ---------- */
function drawQueue(){
  const now=song(queue[cur]),up=queue.slice(cur+1);
  $('#sbody').innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between"><h2>Ďalej</h2><button class="cta g" id="qsh" style="padding:10px 16px;border-radius:14px"><span data-ic="shuffle" data-s="18"></span>Náhodne</button></div>`+
  (now?`<h3>Teraz hrá</h3><div class="item cur">${artH(now)}<div class="meta"><div class="t">${esc(now.title)}</div><div class="s">${esc(now.artist||'')}</div></div><div class="eq"><i></i><i></i><i></i></div></div>`:'')+
  `<h3>Nasleduje · ${up.length}</h3>`+(up.length?`<div class="hint">Potiahni doprava = odstrániť. Potiahni ≡ = zmeniť poradie.</div><div id="ql">`+
  up.map(id=>{const s=song(id);return`<div class="wrap" data-id="${id}"><div class="item">${artH(s)}<div class="meta"><div class="t">${esc(s.title)}</div><div class="s">${esc(s.artist||'')}</div></div><div class="ib handle">${ic('drag',24)}</div></div></div>`}).join('')+`</div>`:`<div class="hint">Rad je prázdny. Ťukni na ＋ pri skladbe v knižnici.</div>`);
  $('#qsh').firstElementChild.innerHTML=ic('shuffle',18);$('#qsh').onclick=shuffle;
  document.querySelectorAll('.wrap').forEach(setupRow);
}
function setupRow(w){
  const sg=w.firstElementChild,h=w.querySelector('.handle');let x0=0,dx=0,sw=false;
  sg.onpointerdown=e=>{if(h.contains(e.target))return;x0=e.clientX;dx=0;sw=true;sg.setPointerCapture(e.pointerId);sg.style.transition='none'};
  sg.onpointermove=e=>{if(!sw)return;dx=Math.max(0,e.clientX-x0);sg.style.transform=`translateX(${dx}px)`};
  const end=()=>{if(!sw)return;sw=false;sg.style.transition='transform .22s';
    if(dx>100){sg.style.transform='translateX(110%)';setTimeout(()=>{const i=queue.indexOf(w.dataset.id,cur+1);if(i>-1)queue.splice(i,1);toast('Odstránené z radu');drawQueue()},200)}else sg.style.transform=''};
  sg.onpointerup=sg.onpointercancel=end;
  sg.onclick=e=>{if(h.contains(e.target)||dx>8)return;const i=queue.indexOf(w.dataset.id,cur+1);if(i>-1)load(i)};
  h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture(e.pointerId);w.classList.add('drag')};
  h.onpointermove=e=>{if(!w.classList.contains('drag'))return;const l=w.parentNode,pv=w.previousElementSibling,nx=w.nextElementSibling;
    if(pv){const r=pv.getBoundingClientRect();if(e.clientY<r.top+r.height/2)l.insertBefore(w,pv)}
    if(nx){const r=nx.getBoundingClientRect();if(e.clientY>r.top+r.height/2)l.insertBefore(nx,w)}};
  h.onpointerup=h.onpointercancel=()=>{w.classList.remove('drag');queue=queue.slice(0,cur+1).concat([...w.parentNode.children].map(c=>c.dataset.id))};
}
/* ---------- štart ---------- */
(async()=>{
  const u=await tx('readonly',s=>s.getAll())||[];let b=[];
  try{const rm=JSON.parse(localStorage.rm||'[]');b=(await(await fetch('songs.json')).json()).filter(x=>!rm.includes(x.id))}catch(e){}
  lib=b.concat(u);sortLib();renderList();
})();
renderList();setP(sk);
</script>
