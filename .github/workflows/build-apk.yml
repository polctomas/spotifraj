name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Ikona a farby
        run: |
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp icon.png $d/ic_launcher.png
            cp icon.png $d/ic_launcher_round.png
            cp icon-fg.png $d/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#07080F</color></resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
      - name: Stály podpisový kľúč
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Zostaviť APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Moja-Hudba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Moja-Hudba-apk
          path: Moja-Hudba.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Moja Hudba v${{ github.run_number }}
          files: Moja-Hudba.apk
